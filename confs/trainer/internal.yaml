defaults:
  - base

max_epochs: 30
precision: bf16-mixed
accumulate_grad_batches: 8

gradient_clip_val: 1.0
deterministic: true

accelerator: gpu
devices: 3
strategy: ddp


callbacks:
  - _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 10
    leave: true

  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${hydra:run.dir}/checkpoints
    every_n_train_steps: 1000
    filename: "{epoch:02d}-{step:04d}"
    save_last: true

  - _target_: src.internal_flow.callbacks.FullReportCallback
    output_dir: ${hydra:run.dir}/reports
    gif_name: evolution.gif


logger:
  - _target_: pytorch_lightning.loggers.WandbLogger
    project: InternalDiffusionProject_${run_name}
    name: "OTScheduler_sigma_v"
    save_dir: "wandb/"
    log_model: true

  
