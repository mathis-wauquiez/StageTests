train_loader:
  _target_: torch.utils.data.DataLoader
  batch_size: 64
  num_workers: 28
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  shuffle: true
  dataset:
    _target_: src.internal_flow.data.MultiImageTrainDataset
    image_path: ${image_path}/train/    # should be a folder like "data/train"
    seed: ${seed}
    sigma: ${sigma}

test_loader:
  _target_: torch.utils.data.DataLoader
  batch_size: 1
  num_workers: 0
  pin_memory: true
  dataset:
    _target_: src.internal_flow.data.MultiImageTestDataset
    image_path: ${image_path}/test/    # should be a folder like "data/test"
    seed: ${seed}
    sigma: ${sigma}
